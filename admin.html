<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم | السوق المفتوح</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#0a0a0a;color:#fff;margin:0;padding:16px}
.login{max-width:340px;margin:50px auto;background:#111;padding:28px;border-radius:14px;text-align:center}
h2{background:linear-gradient(90deg,#1e90ff,#2ecc71);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
input,select,textarea{width:100%;padding:11px;margin:7px 0;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff}
button{background:linear-gradient(90deg,#1e90ff,#2ecc71);color:#fff;border:none;padding:11px 22px;border-radius:8px;cursor:pointer;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:18px;background:#111;border-radius:10px;overflow:hidden}
th,td{padding:11px;border-bottom:1px solid #222;text-align:right}
.btn-sm{padding:6px 12px;font-size:.82rem;margin:2px;border-radius:6px}
.danger{background:#e74c3c}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:99}
.modal.open{display:flex}
.modal-box{background:#111;padding:22px;border-radius:14px;width:92%;max-width:420px;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<div id="login" class="login">
  <h2>لوحة التحكم</h2>
  <p style="color:#888;margin:8px 0 16px">السوق المفتوح</p>
  <input id="u" value="admin" placeholder="اسم المستخدم">
  <input id="p" type="password" placeholder="كلمة المرور">
  <button onclick="doLogin()">دخول</button>
  <p id="err" style="color:#e74c3c;margin-top:8px"></p>
</div>
<div id="dash" class="hidden">
  <button onclick="openM()">+ إضافة إعلان</button>
  <table id="tbl"></table>
  <p style="margin-top:24px"><a href="/" style="color:#1e90ff">← الموقع الرئيسي</a> &nbsp;|&nbsp; <a href="#" onclick="location.reload()" style="color:#e74c3c">خروج</a></p>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="mt">إضافة إعلان</h3>
    <input id="fid" type="hidden">
    <select id="ftype"><option value="land-farm">أرض زراعية</option><option value="land-building">أرض مباني</option><option value="apt-sale">شقة تمليك</option><option value="apt-rent">شقة إيجار</option></select>
    <input id="ftitle" placeholder="العنوان">
    <input id="floc" placeholder="الموقع">
    <input id="farea" placeholder="المساحة">
    <input id="fprice" placeholder="السعر">
    <input id="fphone" placeholder="رقم الموبايل">
    <input id="fimage" placeholder="رابط الصورة (اختياري)">
    <textarea id="fdesc" placeholder="الوصف" rows="2"></textarea>
    <button onclick="saveL()">حفظ</button>
    <button onclick="closeM()" style="background:#333;margin-right:8px">إلغاء</button>
  </div>
</div>
<script>
const KEY='souq_listings_v3';
function getL(){return JSON.parse(localStorage.getItem(KEY)||'[]')}
function setL(l){localStorage.setItem(KEY,JSON.stringify(l))}
function doLogin(){
  if(document.getElementById('u').value==='admin'&&document.getElementById('p').value==='admin123'){
    localStorage.setItem('souq_auth','1');
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    render();
  } else document.getElementById('err').textContent='بيانات خاطئة';
}
if(localStorage.getItem('souq_auth')==='1'){document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');render()}
function render(){
  const list=getL();
  document.getElementById('tbl').innerHTML='<tr><th>العنوان</th><th>النوع</th><th>السعر</th><th></th></tr>'+
    list.map(l=>`<tr><td>${l.title}</td><td>${l.type}</td><td>${l.price}</td><td><button class="btn-sm" onclick="editL(${l.id})">تعديل</button><button class="btn-sm danger" onclick="delL(${l.id})">حذف</button></td></tr>`).join('');
}
function openM(){document.getElementById('fid').value='';document.getElementById('mt').textContent='إضافة إعلان';document.getElementById('modal').classList.add('open')}
function closeM(){document.getElementById('modal').classList.remove('open')}
function editL(id){
  const l=getL().find(x=>x.id===id); if(!l) return;
  document.getElementById('fid').value=id;
  document.getElementById('ftype').value=l.type;
  document.getElementById('ftitle').value=l.title;
  document.getElementById('floc').value=l.location;
  document.getElementById('farea').value=l.area||'';
  document.getElementById('fprice').value=l.price;
  document.getElementById('fphone').value=l.phone;
  document.getElementById('fimage').value=l.image||'';
  document.getElementById('fdesc').value=l.description||'';
  document.getElementById('mt').textContent='تعديل إعلان';
  document.getElementById('modal').classList.add('open');
}
function saveL(){
  const id=document.getElementById('fid').value;
  const item={type:document.getElementById('ftype').value,title:document.getElementById('ftitle').value,location:document.getElementById('floc').value,area:document.getElementById('farea').value,price:document.getElementById('fprice').value,phone:document.getElementById('fphone').value,image:document.getElementById('fimage').value,description:document.getElementById('fdesc').value,icon:'🏠',status:'active'};
  let list=getL();
  if(id){const i=list.findIndex(x=>x.id==id); if(i>-1) Object.assign(list[i],item);}
  else{item.id=Date.now();list.unshift(item);}
  setL(list); closeM(); render();
}
function delL(id){if(confirm('حذف الإعلان؟')){setL(getL().filter(l=>l.id!=id));render();}}
</script>
</body>
</html>
