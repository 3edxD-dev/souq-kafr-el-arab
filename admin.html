<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#fff;margin:0;padding:16px}
.login{max-width:320px;margin:60px auto;background:#111;padding:24px;border-radius:12px;text-align:center}
input,select,textarea{width:100%;padding:10px;margin:6px 0;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#fff}
button{background:linear-gradient(90deg,#1e90ff,#2ecc71);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:bold}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:16px;background:#111}
th,td{padding:10px;border-bottom:1px solid #222;text-align:right}
.btn-sm{padding:6px 10px;font-size:.8rem;margin:2px}
.danger{background:#e74c3c}
</style>
</head>
<body>
<div id="login" class="login">
  <h2 style="color:#2ecc71">لوحة التحكم</h2>
  <input id="user" value="admin" placeholder="المستخدم">
  <input id="pass" type="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
  <p id="msg" style="color:#e74c3c"></p>
</div>
<div id="dash" class="hidden">
  <button onclick="showAdd()">+ إضافة إعلان</button>
  <table id="tbl"></table>
  <p><a href="/" style="color:#1e90ff">← الموقع</a></p>
</div>
<script>
const sb = supabase.createClient('https://gzftaclifoyjilemqslo.supabase.co','sb_publishable_3ebaW8KmCEBCZ_WjaGhHgA_sMyWh14z');
function login(){
  if(document.getElementById('user').value.trim()==='admin' && document.getElementById('pass').value==='admin123'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    load();
  } else document.getElementById('msg').textContent='خطأ';
}
async function load(){
  const {data,error}=await sb.from('listings').select('*').order('id',{ascending:false});
  const tbl=document.getElementById('tbl');
  if(error){tbl.innerHTML='<tr><td>خطأ: '+error.message+'</td></tr>';return}
  if(!data||!data.length){tbl.innerHTML='<tr><td>لا توجد إعلانات</td></tr>';return}
  tbl.innerHTML='<tr><th>العنوان</th><th>النوع</th><th>السعر</th><th></th></tr>'+data.map(r=>`<tr><td>${r.title||''}</td><td>${r.type||''}</td><td>${r.price||''}</td><td><button class="btn-sm danger" onclick="del(${r.id})">حذف</button></td></tr>`).join('');
}
function showAdd(){
  const t=prompt('العنوان:'); if(!t) return;
  const item={title:t,location:prompt('الموقع')||'',area:prompt('المساحة')||'',price:prompt('السعر')||'',phone:prompt('الموبايل')||'',type:'land-farm',status:'active'};
  sb.from('listings').insert(item).then(()=>{load();alert('تم')});
}
function del(id){if(confirm('حذف؟')) sb.from('listings').delete().eq('id',id).then(()=>load())}
</script>
</body>
</html>
