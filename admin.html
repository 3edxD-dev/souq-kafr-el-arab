<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#fff;margin:0;padding:16px}
.login{max-width:320px;margin:60px auto;background:#111;padding:24px;border-radius:12px;text-align:center}
input{width:100%;padding:10px;margin:8px 0;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#fff}
button{background:linear-gradient(90deg,#1e90ff,#2ecc71);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:bold;width:100%}
.hidden{display:none}
</style>
</head>
<body>
<div id="login" class="login">
  <h2 style="color:#2ecc71">لوحة التحكم</h2>
  <input id="user" placeholder="المستخدم" value="admin">
  <input id="pass" type="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
  <p id="msg" style="color:#e74c3c"></p>
</div>
<div id="dash" class="hidden">
  <h3>مرحباً</h3>
  <button onclick="add()">+ إضافة إعلان</button>
  <div id="list"></div>
  <p><a href="/" style="color:#1e90ff">← الموقع</a></p>
</div>
<script>
const sb = supabase.createClient('https://gzftaclifoyjilemqslo.supabase.co','sb_publishable_3ebaW8KmCEBCZ_WjaGhHgA_sMyWh14z');
function login(){
  if(document.getElementById('user').value.trim()==='admin' && document.getElementById('pass').value==='admin123'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    load();
  } else document.getElementById('msg').textContent='خطأ';
}
async function load(){
  const {data}=await sb.from('listings').select('*').order('id',{ascending:false});
  document.getElementById('list').innerHTML = (data||[]).map(r=>`<p>${r.title} - \( {r.price} <button onclick="del( \){r.id})">حذف</button></p>`).join('') || 'لا توجد إعلانات';
}
function add(){
  const t=prompt('العنوان'); if(!t)return;
  sb.from('listings').insert({title:t,price:prompt('السعر'),phone:prompt('الموبايل'),type:'land',status:'active'}).then(()=>load());
}
function del(id){ if(confirm('حذف؟')) sb.from('listings').delete().eq('id',id).then(()=>load()); }
</script>
</body>
</html>
