<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#fff;margin:0;padding:16px}
.login{max-width:320px;margin:60px auto;background:#111;padding:24px;border-radius:12px;text-align:center}
input,select,textarea{width:100%;padding:10px;margin:6px 0;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#fff}
button{background:linear-gradient(90deg,#1e90ff,#2ecc71);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:bold}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:16px;background:#111}
th,td{padding:10px;border-bottom:1px solid #222;text-align:right}
.btn-sm{padding:6px 10px;font-size:.8rem;margin:2px}
.danger{background:#e74c3c}
.ok{background:#2ecc71;color:#000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{background:#111;padding:20px;border-radius:12px;width:90%;max-width:400px}
</style>
</head>
<body>
<div id="login" class="login">
  <h2 style="color:#2ecc71">لوحة التحكم</h2>
  <input id="user" value="admin" placeholder="المستخدم">
  <input id="pass" type="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
  <p id="msg" style="color:#e74c3c"></p>
</div>
<div id="dash" class="hidden">
  <button onclick="openAdd()">+ إضافة إعلان</button>
  <table id="tbl"></table>
  <p><a href="/" style="color:#1e90ff">← الموقع</a></p>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="mt">إضافة</h3>
    <input id="ftitle" placeholder="العنوان">
    <input id="floc" placeholder="الموقع">
    <input id="farea" placeholder="المساحة">
    <input id="fprice" placeholder="السعر">
    <input id="fphone" placeholder="الموبايل">
    <select id="ftype"><option value="land-farm">أرض زراعية</option><option value="land-building">أرض مباني</option><option value="apt-sale">شقة تمليك</option><option value="apt-rent">شقة إيجار</option></select>
    <textarea id="fdesc" placeholder="الوصف" rows="2"></textarea>
    <input id="fidx" type="hidden">
    <button onclick="save()">حفظ</button>
    <button onclick="closeM()" style="background:#333">إلغاء</button>
  </div>
</div>
<script>
const sb = supabase.createClient('https://gzftaclifoyjilemqslo.supabase.co','sb_publishable_3ebaW8KmCEBCZ_WjaGhHgA_sMyWh14z');
let rows = [];
function login(){
  if(document.getElementById('user').value.trim()==='admin' && document.getElementById('pass').value==='admin123'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    load();
  } else document.getElementById('msg').textContent='خطأ';
}
async function load(){
  const {data,error}=await sb.from('listings').select('*');
  const tbl=document.getElementById('tbl');
  if(error){tbl.innerHTML='<tr><td>خطأ: '+error.message+'</td></tr>';return}
  rows = data || [];
  if(!rows.length){tbl.innerHTML='<tr><td>لا توجد إعلانات</td></tr>';return}
  tbl.innerHTML='<tr><th>العنوان</th><th>النوع</th><th>السعر</th><th>الحالة</th><th></th></tr>'+rows.map((r,i)=>`<tr><td>${r.title||''}</td><td>${r.type||''}</td><td>${r.price||''}</td><td>${r.status==='active'?'منشور':'مخفي'}</td><td><button class="btn-sm" onclick="edit(${i})">تعديل</button><button class="btn-sm ok" onclick="pub(${i})">نشر</button><button class="btn-sm danger" onclick="del(${i})">حذف</button></td></tr>`).join('');
}
function openAdd(){document.getElementById('fidx').value='';document.getElementById('mt').textContent='إضافة';document.getElementById('modal').classList.add('open')}
function closeM(){document.getElementById('modal').classList.remove('open')}
function edit(i){
  const r=rows[i];
  document.getElementById('fidx').value=i;
  document.getElementById('ftitle').value=r.title||'';
  document.getElementById('floc').value=r.location||'';
  document.getElementById('farea').value=r.area||'';
  document.getElementById('fprice').value=r.price||'';
  document.getElementById('fphone').value=r.phone||'';
  document.getElementById('ftype').value=r.type||'land-farm';
  document.getElementById('fdesc').value=r.description||'';
  document.getElementById('mt').textContent='تعديل';
  document.getElementById('modal').classList.add('open');
}
async function save(){
  const i=document.getElementById('fidx').value;
  const item={title:document.getElementById('ftitle').value,location:document.getElementById('floc').value,area:document.getElementById('farea').value,price:document.getElementById('fprice').value,phone:document.getElementById('fphone').value,type:document.getElementById('ftype').value,description:document.getElementById('fdesc').value,status:'active'};
  if(i===''){await sb.from('listings').insert(item)}
  else{const old=rows[i];await sb.from('listings').update(item).eq('title',old.title).eq('phone',old.phone)}
  closeM(); load();
}
function pub(i){
  const r=rows[i];
  sb.from('listings').update({status:'active'}).eq('title',r.title).eq('phone',r.phone).then(()=>{load();alert('تم النشر')});
}
function del(i){
  if(!confirm('حذف؟')) return;
  const r=rows[i];
  sb.from('listings').delete().eq('title',r.title).eq('phone',r.phone).then(()=>load());
}
</script>
</body>
</html>
