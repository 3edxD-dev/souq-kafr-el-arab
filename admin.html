<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم | السوق المفتوح</title>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#fff;margin:0;padding:16px}
.login{max-width:320px;margin:60px auto;background:#111;padding:24px;border-radius:12px;text-align:center}
input,select,textarea{width:100%;padding:10px;margin:6px 0;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#fff}
button{background:linear-gradient(90deg,#1e90ff,#2ecc71);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:16px;background:#111}
th,td{padding:10px;border-bottom:1px solid #222;text-align:right}
.btn-sm{padding:6px 10px;font-size:.8rem;margin:2px}
.danger{background:#e74c3c}
.hidden{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{background:#111;padding:20px;border-radius:12px;width:90%;max-width:400px}
</style>
</head>
<body>
<div id="login" class="login">
  <h2>لوحة التحكم</h2>
  <input id="u" value="admin" placeholder="المستخدم">
  <input id="p" type="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
  <p id="err" style="color:#e74c3c"></p>
</div>
<div id="dash" class="hidden">
  <button onclick="openModal()">+ إضافة إعلان</button>
  <table id="tbl"></table>
  <p style="margin-top:20px"><a href="/" style="color:#1e90ff">← الموقع</a> | <a href="#" onclick="logout()" style="color:#e74c3c">خروج</a></p>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="mt">إضافة إعلان</h3>
    <input id="fid" type="hidden">
    <select id="ftype"><option value="land">أرض</option><option value="apt">شقة</option></select>
    <input id="ftitle" placeholder="العنوان">
    <input id="floc" placeholder="الموقع">
    <input id="farea" placeholder="المساحة">
    <input id="fprice" placeholder="السعر">
    <input id="fphone" placeholder="رقم الموبايل">
    <input id="fimage" placeholder="رابط الصورة (اختياري)">
    <button onclick="save()">حفظ</button>
    <button onclick="closeModal()" style="background:#333">إلغاء</button>
  </div>
</div>
<script>
const KEY='souq_listings';
function getL(){return JSON.parse(localStorage.getItem(KEY)||'[]')}
function setL(l){localStorage.setItem(KEY,JSON.stringify(l))}
function login(){
  if(document.getElementById('u').value==='admin'&&document.getElementById('p').value==='admin123'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    render();
  } else document.getElementById('err').textContent='خطأ';
}
function logout(){location.reload()}
function render(){
  const list=getL();
  document.getElementById('tbl').innerHTML='<tr><th>العنوان</th><th>السعر</th><th></th></tr>'+list.map(l=>`<tr><td>${l.title}</td><td>${l.price}</td><td><button class="btn-sm" onclick="edit(${l.id})">تعديل</button><button class="btn-sm danger" onclick="del(${l.id})">حذف</button></td></tr>`).join('');
}
function openModal(){document.getElementById('fid').value='';document.getElementById('mt').textContent='إضافة إعلان';document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function edit(id){
  const l=getL().find(x=>x.id===id);
  document.getElementById('fid').value=id;
  document.getElementById('ftype').value=l.type;
  document.getElementById('ftitle').value=l.title;
  document.getElementById('floc').value=l.location;
  document.getElementById('farea').value=l.area||'';
  document.getElementById('fprice').value=l.price;
  document.getElementById('fphone').value=l.phone;
  document.getElementById('fimage').value=l.image||'';
  document.getElementById('mt').textContent='تعديل إعلان';
  document.getElementById('modal').classList.add('open');
}
function save(){
  const id=document.getElementById('fid').value;
  const item={type:document.getElementById('ftype').value,title:document.getElementById('ftitle').value,location:document.getElementById('floc').value,area:document.getElementById('farea').value,price:document.getElementById('fprice').value,phone:document.getElementById('fphone').value,image:document.getElementById('fimage').value,icon:'🏠'};
  let list=getL();
  if(id){const i=list.findIndex(x=>x.id==id);if(i>-1)Object.assign(list[i],item)}
  else{item.id=Date.now();list.unshift(item)}
  setL(list);closeModal();render();
}
function del(id){if(confirm('حذف؟')){setL(getL().filter(l=>l.id!=id));render()}}
if(localStorage.getItem('souq_auth')==='1'){document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');render()}
</script>
</body>
</html>
