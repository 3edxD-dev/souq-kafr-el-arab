<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السوق المفتوح - قرية كفر العرب</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="header">
  <div class="container">
    <div class="logo">
      <span class="logo-main">السوق المفتوح</span>
      <span class="logo-sub">كفر العرب</span>
    </div>
    <a href="/admin.html" class="nav-link">لوحة التحكم</a>
  </div>
</header>

<section class="hero" id="home">
  <div class="hero-badges">
    <div class="badge badge-buy">للشراء</div>
    <div class="badge badge-sell">للبيع</div>
  </div>
  <h1 class="hero-title">السوق المفتوح</h1>
  <h2 class="hero-subtitle">بقرية كفر العرب</h2>
  <p class="hero-desc">عايز تشتري قطعة أرض حدد المكان ومتوسط السعر وهندبرها لك<br>عايز تبيع أرض زراعية أو مباني بأعلى سعر هنجيبلك مشتري</p>
</section>

<section class="section" id="lands">
  <div class="container">
    <h2 class="section-title">الأراضي</h2>
    <div class="listings-grid" id="lands-grid"></div>
  </div>
</section>

<section class="section" id="apartments">
  <div class="container">
    <h2 class="section-title">الشقق</h2>
    <div class="listings-grid" id="apts-grid"></div>
  </div>
</section>

<section class="section" id="contact">
  <div class="container">
    <h2 class="section-title">تواصل معنا</h2>
    <form id="contact-form" class="contact-form">
      <input type="text" name="name" placeholder="الاسم" required>
      <input type="tel" name="phone" placeholder="رقم الموبايل" required>
      <textarea name="details" placeholder="التفاصيل" rows="3"></textarea>
      <button type="submit" class="btn btn-gradient">إرسال</button>
    </form>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
